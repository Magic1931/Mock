<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Burger Day</title>
  <style>
    body {
      margin: 0;
      background: #0b1d3a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      color: #fff;
    }

    .envelope {
      font-size: 450px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .envelope:hover {
      transform: scale(1.1);
    }

    .burger {
      position: absolute;
      bottom: -10vh;
      font-size: 40px;
      animation: floatUp 8s linear forwards;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }

    /* Cake in center, stack bottom-up */
    .cake {
      position: absolute;
      top: 45%; 
      left: 50%;
      transform: translateX(-50%) scale(2);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      animation: breatheCake 3s ease-in-out infinite;
    }
    .layer1, .layer2, .layer3, .icing, .candle {
      border-radius: 8px;
      margin: 2px 0;
    }
    .layer1 { background: #f2c08d; width: 120px; height: 24px; }
    .layer2 { background: #e0a96d; width: 120px; height: 24px; }
    .layer3 { background: #d78f54; width: 120px; height: 24px; }
    .icing  { background: #ffeded; width: 120px; height: 12px; }
    .candle { background: #ffeb3b; width: 12px; height: 36px; border-radius: 2px; }

    @keyframes breatheCake {
      0%, 100% { transform: translateX(-50%) scale(1.3); }
      50% { transform: translateX(-50%) scale(1.35); }
    }

    h1, h2 {
      margin: 0;
      animation: breathe 3s ease-in-out infinite, glow 2s infinite alternate;
      position: relative;
      top: 190px;
    }
    h1 { font-size: clamp(2rem, 5vw, 4rem); }
    h2 { font-size: clamp(1.1rem, 2.3vw, 2rem); margin-top: .75rem; }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff, 0 0 20px #a5c9ff; }
      to   { text-shadow: 0 0 20px #fff, 0 0 40px #8ab4f8; }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Banderitas */
    .banderitas {
      position: absolute;
      top: 7%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px; /* space between HAPPY and BIRTHDAY */
      z-index: 3;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .banderita {
      width: 80px;
      height: 80px;
      background: pink;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-weight: bold;
      font-size: 35px;
      color: #0b1d3a;
      transform-origin: top center;
      opacity: 0;
      transition: opacity 0.5s;
    }

    #main-screen { display: none; }
  </style>
</head>
<body>
  <div id="envelopeScreen">
    <div class="envelope" onclick="openCard()">📩</div>
    <p>Click to open</p>
  </div>

  <div id="main-screen" aria-live="polite">
    <div class="banderitas" id="banderitas"></div>
    <div class="cake" id="cake"></div>
    <h1>🎉 Happy Burger Day! 🎉</h1>
    <h2>More Birthdays to Come</h2>
  </div>

  <audio id="birthdaySong" src="Bday song.mp3"></audio>

  <script>
   function openCard() {
  document.getElementById("envelopeScreen").style.display = "none";
  document.getElementById("main-screen").style.display = "block";

  const song = document.getElementById("birthdaySong");
  song.play();

  function createBurger() {
    const burger = document.createElement("div");
    burger.classList.add("burger");
    burger.textContent = "🍔";
    burger.style.left = Math.random() * 100 + "vw";
    burger.style.fontSize = (30 + Math.random() * 40) + "px";
    burger.style.animationDuration = (4 + Math.random() * 6) + "s";
    document.body.appendChild(burger);
    setTimeout(() => burger.remove(), 10000);
  }

  // 🍟 Fries function (same as burger)
  function createFries() {
    const fries = document.createElement("div");
    fries.classList.add("burger"); // reuse same CSS animation
    fries.textContent = "🍟";
    fries.style.left = Math.random() * 100 + "vw";
    fries.style.fontSize = (25 + Math.random() * 35) + "px";
    fries.style.animationDuration = (4 + Math.random() * 6) + "s";
    document.body.appendChild(fries);
    setTimeout(() => fries.remove(), 10000);
  }

  // Spawn burgers & fries alternately
  setInterval(createBurger, 500);
  setInterval(createFries, 700);

  // Cake layers appear bottom-up
  const cakeContainer = document.getElementById("cake");
  const layers = ["layer1","layer2","layer3","icing","candle"];
  layers.forEach((cls, i) => {
    setTimeout(() => {
      const div = document.createElement("div");
      div.className = cls;
      cakeContainer.appendChild(div);
    }, i * 400);
  });

  // Banderitas (two rows: HAPPY / BIRTHDAY)
  const banderitas = document.getElementById("banderitas");

  function createRow(text, archHeight, delayStart=0) {
    const row = document.createElement("div");
    row.className = "row";
    const total = text.length;

    for (let i = 0; i < total; i++) {
      const flag = document.createElement("div");
      flag.className = "banderita";
      flag.textContent = text[i];

      // Arch curve
      const offset = Math.sin((i / (total - 1)) * Math.PI) * archHeight;
      flag.style.transform = `translateY(${offset}px)`;

      row.appendChild(flag);

      setTimeout(() => { flag.style.opacity = 1; }, delayStart + i * 100);
    }
    banderitas.appendChild(row);
  }

  createRow("HAPPY", 25, 0);
  createRow("BIRTHDAY", 35, 600);
}
  </script>
</body>
</html>
